<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0050B3"/>
      <stop offset="100%" stop-color="#1890FF"/>
    </linearGradient>
    <linearGradient id="lock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE58F"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="url(#bg)"/>
  <!-- Lock shackle -->
  <path d="M44 56 V44 A20 20 0 0 1 84 44 V56" 
        fill="none" stroke="url(#lock)" stroke-width="8" stroke-linecap="round"/>
  <!-- Lock body -->
  <rect x="36" y="56" width="56" height="44" rx="8" ry="8" fill="url(#lock)"/>
  <!-- Keyhole -->
  <circle cx="64" cy="72" r="6" fill="#0050B3"/>
  <rect x="61" y="72" width="6" height="14" rx="3" ry="3" fill="#0050B3"/>
</svg>